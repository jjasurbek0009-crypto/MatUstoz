services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: matustoz
      POSTGRES_USER: matustoz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env faylida POSTGRES_PASSWORD kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matustoz -d matustoz"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Bu qiymat .env dagi DATABASE_URL dan ustun turadi (konteyner ichidagi baza)
      DATABASE_URL: postgresql://matustoz:${POSTGRES_PASSWORD}@db:5432/matustoz
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
